services:
  database:
    image: image-studio:local
    pull_policy: never
    command:
      - python
      - -c
      - "from image_studio.database import Database, DatabaseSettings; Database(DatabaseSettings.from_env()).initialize()"
    environment:
      IMAGE_DATABASE_PATH: /data/image-studio.db
    volumes:
      - image_data:/data
    restart: "no"

  app:
    image: image-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_completed_successfully
    expose:
      - "8000"
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_COOKIE_SECURE: "true"
      IMAGE_DATABASE_PATH: /data/image-studio.db
      IMAGE_STORAGE_PATH: /data/images
      FRONTEND_DIST_PATH: /app/frontend/dist
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2.5-sunburst}
      IMAGE_MODEL_CATALOG: ${IMAGE_MODEL_CATALOG:-}
      IMAGE_ACTIVE_MODEL: ${IMAGE_ACTIVE_MODEL:-default}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_PROVIDER_TIMEOUT_SECONDS: ${IMAGE_PROVIDER_TIMEOUT_SECONDS:-180}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-image-studio}
    secrets:
      - session_secret
    volumes:
      - image_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    image: image-studio-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["publish"]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    secrets:
      - ngrok_basic_auth
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$NGROK_AUTHTOKEN" ]; then
          echo "NGROK_AUTHTOKEN is not configured." >&2
          exit 1
        fi
        basic_auth="$$(cat /run/secrets/ngrok_basic_auth)"
        if [ -n "$$NGROK_URL" ]; then
          exec ngrok http frontend:80 --basic-auth "$$basic_auth" --url "$$NGROK_URL" --log stdout --log-format json
        fi
        exec ngrok http frontend:80 --basic-auth "$$basic_auth" --log stdout --log-format json
    restart: "on-failure:3"

secrets:
  session_secret:
    file: ./.secrets/session_secret
  ngrok_basic_auth:
    file: ./.secrets/ngrok-basic-auth

volumes:
  image_data:
    name: ${IMAGE_DATA_VOLUME:-visual_assistant_image_data}
