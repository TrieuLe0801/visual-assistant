services:
  database:
    image: image-studio:local
    pull_policy: never
    command:
      - python
      - -c
      - "from image_studio.database import Database, DatabaseSettings; Database(DatabaseSettings.from_env()).initialize()"
    environment:
      IMAGE_DATABASE_PATH: /data/image-studio.db
    volumes:
      - image_data:/data
    restart: "no"

  app:
    image: image-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_completed_successfully
    expose:
      - "8000"
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SESSION_COOKIE_SECURE: "true"
      IMAGE_DATABASE_PATH: /data/image-studio.db
      IMAGE_STORAGE_PATH: /data/images
      FRONTEND_DIST_PATH: /app/frontend/dist
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2.5-sunburst}
      IMAGE_MODEL_CATALOG: ${IMAGE_MODEL_CATALOG:-}
      IMAGE_ACTIVE_MODEL: ${IMAGE_ACTIVE_MODEL:-default}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_PROVIDER_TIMEOUT_SECONDS: ${IMAGE_PROVIDER_TIMEOUT_SECONDS:-180}
      PROMPT_MODEL: ${PROMPT_MODEL:-gpt-6-luna}
      PROMPT_API_BASE_URL: ${PROMPT_API_BASE_URL:-https://api.openai.com/v1}
      PROMPT_API_KEY: ${PROMPT_API_KEY:-}
      PROMPT_TIMEOUT_SECONDS: ${PROMPT_TIMEOUT_SECONDS:-30}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-image-studio}
    secrets:
      - session_secret
    volumes:
      - image_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    image: image-studio-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["publish"]
    depends_on:
      frontend:
        condition: service_healthy
    command: ["tunnel", "--url", "http://frontend:80"]
    restart: unless-stopped

secrets:
  session_secret:
    file: ./.secrets/session_secret
volumes:
  image_data:
    name: ${IMAGE_DATA_VOLUME:-visual_assistant_image_data}
