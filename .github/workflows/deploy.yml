name: Deploy Compose

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (must be main)
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-compose
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.ref == 'main'
    runs-on: [self-hosted, image-studio-deploy]
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          clean: true
          persist-credentials: false
      - name: Stage source into persistent deployment checkout
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          test -n "$DEPLOY_DIR"
          test "${DEPLOY_DIR#/}" != "$DEPLOY_DIR"
          test "$DEPLOY_DIR" != "$GITHUB_WORKSPACE"
          case "$DEPLOY_DIR" in "$GITHUB_WORKSPACE"/*) exit 1;; esac
          test -f "$DEPLOY_DIR/.deploy-target"
          test "$(cat "$DEPLOY_DIR/.deploy-target")" = image-studio-compose-host
          rsync -a --delete --exclude '.git/' --exclude '.env' --exclude '.secrets/' --exclude 'backups/' --exclude '.deploy-target' source/ "$DEPLOY_DIR/"
      - name: Deploy with backup and health check
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: "$DEPLOY_DIR/scripts/deploy-compose.sh"
