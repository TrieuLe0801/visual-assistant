[project]
name = "image-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-core>=1.0,<2",
    "langsmith>=0.4,<1",
    "pillow>=12.3.0,<13; python_version < '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.0",
    "pytest>=8.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
".codex/hooks/format_python.py" = ["UP045"]
"scripts/init-deployment-secrets.py" = ["N999"]
